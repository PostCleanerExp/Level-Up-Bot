services:
  - type: web
    name: levelupbot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python Main.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: USER_DB_PATH
        sync: false
